# Example: Home Assistant Map Card
# Shows one or more Catalunya beaches on the built-in map with water quality state labels.
#
# Requirements:
#   - Home Assistant Map Card (built-in, no extra dependencies)
#   - Coordinates must be available on the sensor (resolved at setup time from the beach
#     list, or from the detail API response once it is fetched).
#
# Which entity to use:
#   sensor.<beach>_water_quality   → label shows "Excellent / Good / Acceptable / Poor"
#   sensor.<beach>_beach_name      → label shows the beach name text
#
# Replace YOUR_BEACH_SLUG with the entity slug for your beach, e.g.:
#   platja_de_barcelona, platja_de_la_nova_mar_bella, …

type: map
title: Catalunya Beaches – Water Quality
theme_mode: auto        # follows HA theme (light / dark)
auto_fit: true          # viewport auto-fits all markers
grid_options:
  columns: full
  rows: 6
entities:
  - entity: sensor.YOUR_BEACH_SLUG_1_water_quality   # Replace
    label_mode: state                                 # shows quality level on the pin
  - entity: sensor.YOUR_BEACH_SLUG_2_water_quality   # Replace
    label_mode: state
  # Add more beaches as needed
