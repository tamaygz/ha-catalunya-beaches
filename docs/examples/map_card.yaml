# Example: Home Assistant Map Card
# Shows Catalunya beaches on the built-in map using the beach_name sensor.
#
# Requirements:
#   - Home Assistant Map Card (built-in, no extra dependencies)
#   - Coordinates available on the beach_name sensor (resolved at setup
#     from the beach list, or from the detail API response).
#
# Map pin modes (pick one per entity):
#   label_mode: state      → shows the beach name text on the pin
#   label_mode: icon       → shows a dynamic warning icon (beach/jellyfish/water-alert)
#   label_mode: attribute  → shows the value of `attribute:` on the pin
#   (omit label_mode)      → shows entity_picture (beach photo) as pin image
#
# Only beach_name sensors carry coordinates — other sensors no longer have
# lat/long attributes, so one pin per beach appears on the map.
#
# Replace YOUR_BEACH_SLUG with the entity slug for your beach, e.g.:
#   platja_de_barcelona, platja_de_la_nova_mar_bella, …

# --- Variant A: Beach name labels ---
type: map
title: Catalunya Beaches
theme_mode: auto
auto_fit: true
grid_options:
  columns: full
  rows: 6
entities:
  - entity: sensor.YOUR_BEACH_SLUG_1_beach_name
    label_mode: state
  - entity: sensor.YOUR_BEACH_SLUG_2_beach_name
    label_mode: state

